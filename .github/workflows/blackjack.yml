name: Blackjack
on:
  issues:
    types: [opened]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
  issues: write
jobs:
  play:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'blackjack-')
    # 잡 수준 concurrency: 건너뛴(게임과 무관한) 실행은 그룹에 들어오지 않아 대기 중인 게임 실행을 취소하지 않는다.
    concurrency:
      group: blackjack
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 대기했던 실행도 앞 실행이 push한 최신 상태를 받도록 이벤트 SHA 대신 브랜치 끝을 받는다.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m blackjack.main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLACKJACK_SECRET: ${{ secrets.BLACKJACK_SECRET }}
